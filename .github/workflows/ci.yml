name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Build
        run: |
          go build ./cmd/cloud-control
          go build ./cmd/edge-agent

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build cloud image
        run: docker build -f Dockerfile.cloud -t rv-cloud-control:test .

      - name: Build edge image
        run: docker build -f Dockerfile.edge -t rv-edge-agent:test .
